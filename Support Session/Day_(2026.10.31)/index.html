<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Data</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Customer List</h1>
        <button id="loadBtn">Load Customers</button>
        
        <div id="loading" style="display: none;">Loading...</div>
        
        <table id="customerTable" style="display: none;">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Address</th>
                    <th>Age</th>
                    <th>Contact</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Data ටික මෙතනට එයි -->
            </tbody>
        </table>
    </div>

    <script src="app.js"></script>
</body>
</html>
